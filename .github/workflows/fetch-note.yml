name: Fetch note RSS

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00 JST
  workflow_dispatch: # Actionsタブから手動実行も可能

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RSSを取得して _data/note_posts.yml を更新
        run: ruby scripts/fetch_note_rss.rb

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/note_posts.yml
          if ! git diff --staged --quiet; then
            git commit -m "Update note posts"
            git push
          else
            echo "新しい記事はありませんでした"
          fi

      # イベント表示の「今後/過去」判定はビルド時の日付で決まるため、
      # 記事の有無にかかわらず毎日Pagesを再ビルドして判定を最新に保つ
      - name: Pagesを再ビルド
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
