# イベント情報
#
# 新しいイベントはこのファイルに追記する。
# - トップページ: 終了日が今日以降のイベントを開催日順に最大2件表示
# - イベントページ: 「今後のイベント」欄に同じ条件で全件表示
# - 終了したイベントは自動で表示されなくなる（ファイルから消さなくてOK）
#   詳しい開催レポートを残したい場合は events.md の「過去のイベント」に書く
#
# 書式（end_date・place・summary・url・image は省略可）:
# - title: "イベント名"
#   start_date: 2026-07-01   # 開始日
#   end_date: 2026-07-07     # 終了日（1日だけなら省略）
#   place: "開催場所"
#   summary: "1〜2文の紹介文"
#   url: https://example.com/  # 詳細ページがあれば（画像・タイトルのリンク先になる）
#   image: https://example.com/flyer.jpg  # カードに表示する画像
#     # 外部URL（http〜）でも、サイト内画像（/assets/images/xxx.jpg）でもOK
#     # url があれば画像をクリックでそのページへ移動できる

